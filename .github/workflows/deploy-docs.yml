name: Deploy Docs to GitHub Pages

on:
  workflow_call:
    inputs:
      docs-project-path:
        description: "Path to the Blazor WASM docs project (e.g., src/Docs/Docs.csproj)"
        required: true
        type: string
      base-href:
        description: "Base href for GitHub Pages (e.g., /Blazor.Map/)"
        required: true
        type: string
      node-version:
        description: "Node.js version to use when building docs assets"
        required: false
        default: "24"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          global-json-file: global.json

      - name: setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ inputs.node-version }}

      - run: dotnet publish "$DOCS_PROJECT_PATH" -c Release -o publish
        env:
          HUSKY: "0"
          DOCS_PROJECT_PATH: ${{ inputs.docs-project-path }}

      - name: Fix base href
        run: sed -i "s|<base href=\"/\" />|<base href=\"$BASE_HREF\" />|g" publish/wwwroot/index.html
        env:
          BASE_HREF: ${{ inputs.base-href }}

      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Add 404.html for SPA routing
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
