name: Deploy Docs to GitHub Pages

on:
  workflow_call:
    inputs:
      docs-project-path:
        description: "Path to the Blazor WASM docs project (e.g., src/Docs/Docs.csproj)"
        required: true
        type: string
      base-href:
        description: "Base href for GitHub Pages (e.g., /Blazor.Map/)"
        required: true
        type: string
      node-version:
        description: "Node.js version to use when building docs assets"
        required: false
        default: "lts/*"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - run: dotnet publish ${{ inputs.docs-project-path }} -c Release -o publish
        env:
          HUSKY: "0"

      - name: Fix base href
        run: sed -i "s|<base href=\"/\" />|<base href=\"${{ inputs.base-href }}\" />|g" publish/wwwroot/index.html

      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Add 404.html for SPA routing
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
